const lobbyEl = document.getElementById('lobby'), codeInput = document.getElementById('codeInput');
const $ = id => document.getElementById(id);
const inviteCode = (new URLSearchParams(location.search).get('room') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4);
if (inviteCode) $('onlineBtn').textContent = `초대받은 방 입장 (${inviteCode})`;

function netSend(obj){ try { if (NET.ws && NET.ws.readyState === 1) NET.ws.send(JSON.stringify(obj)); } catch(e){} }
function openLobby(){
  G.mode = 'lobby';
  lobbyEl.classList.remove('hide'); $('lobbyErr').textContent = '';
  if (online()) return showLobbyRoom();
  $('lobbyJoin').classList.remove('hide'); $('lobbyRoom').classList.add('hide');
  const code = inviteCode || NET.code;
  if (code){ codeInput.value = code; connect(code); }
}
function showLobbyRoom(){
  G.mode = 'lobby';
  lobbyEl.classList.remove('hide');
  $('lobbyJoin').classList.add('hide'); $('lobbyRoom').classList.remove('hide');
  renderLobby();
}
function renderLobby(){
  $('roomCode').textContent = NET.code || '----';
  const ul = $('playerList'); ul.innerHTML = '';
  NET.players.forEach(p => {
    const c = ROSTER[p.char] || ROSTER[0];
    const li = document.createElement('li'); if (p.id === NET.me) li.className = 'me';
    li.appendChild(avatar(c, c.face, 34));
    const sp = document.createElement('span'); sp.textContent = (p.id === NET.host ? '👑 ' : '') + p.name + (p.id === NET.me ? ' (나)' : '');
    li.appendChild(sp); ul.appendChild(li);
  });
  const isHost = NET.me && NET.me === NET.host;
  $('hostStartBtn').classList.toggle('hide', !isHost);
  $('lobbyTip').textContent = isHost ? `${NET.players.length}명 참가 중 · 빈 레인은 AI가 채워요` : '방장이 시작하길 기다리는 중…';
}
function makeCode(){
  const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  return Array.from({length:4}, () => A[(Math.random()*A.length)|0]).join('');
}
function joinRoom(){
  const code = codeInput.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (code.length !== 4){ $('lobbyErr').textContent = '코드는 4자리예요'; return; }
  connect(code);
}
function connect(code){
  if (NET.ws) return;
  $('lobbyErr').textContent = '연결 중…';
  NET.code = code; NET.leaving = false; NET.serverErr = false;
  let ws;
  try { ws = new WebSocket(`${SERVER_URL}/room/${code}?name=${encodeURIComponent(G.playerName)}&char=${G.pick}`); }
  catch(e){ $('lobbyErr').textContent = '서버에 연결할 수 없어요'; return; }
  NET.ws = ws;
  ws.onopen = () => {
    $('lobbyErr').textContent = '';
    // 아무 메시지도 없으면 회사·공유기 네트워크가 연결을 끊어버리므로 주기적으로 신호를 보냄
    clearInterval(NET.beat); NET.beat = setInterval(() => netSend({t:'ping'}), 10000);
    try { history.replaceState(null, '', `${location.pathname}?room=${code}`); } catch(e){}
    showLobbyRoom();
  };
  ws.onmessage = e => { let m; try { m = JSON.parse(e.data); } catch(_){ return; } onNet(m); };
  ws.onclose = ev => {
    const wasLeaving = NET.leaving;
    NET.lastClose = ev ? ev.code : 0;
    clearInterval(NET.beat); NET.beat = null;
    NET.ws = null; NET.me = null; NET.players = [];
    if (wasLeaving) return;
    // 끊기면 같은 방으로 몇 번 자동 재접속
    if (!NET.serverErr && NET.code && NET.retry < 3){
      NET.retry++;
      const code = NET.code;
      setTimeout(() => { if (!NET.ws && !NET.leaving) connect(code); }, 600*NET.retry);
    }
    // 경기 중이었다면 로비 화면으로 되돌림
    resultsEl.classList.add('hide'); callEl.className = '';
    if (G.mode !== 'lobby'){ G.mode = 'lobby'; resetRace(); buildDots(); }
    lobbyEl.classList.remove('hide');
    $('lobbyJoin').classList.remove('hide'); $('lobbyRoom').classList.add('hide');
    const err = $('lobbyErr').textContent;
    if (!NET.serverErr && NET.retry && NET.retry <= 3 && NET.code) $('lobbyErr').textContent = '연결이 끊겨서 다시 연결하는 중…';
    else if (!err || err === '연결 중…' || err.startsWith('연결이 끊겨서')) $('lobbyErr').textContent = `연결이 끊겼어요. 다시 입장해 주세요. (코드 ${NET.lastClose || '?'})`;
  };
}
function leaveRoom(){
  NET.leaving = true;
  try { NET.ws && NET.ws.close(); } catch(e){}
  NET.ws = null; NET.code = null; NET.me = null; NET.players = [];
  G.wantOnline = false;
  try { history.replaceState(null, '', location.pathname); } catch(e){}
  lobbyEl.classList.add('hide'); resultsEl.classList.add('hide');
  callEl.className = '';
  resetRace(); buildDots();
  G.mode = 'title'; $('title').classList.remove('hide');
}
const runnerById = id => runners.find(r => r.id === id);
function onNet(m){
  switch (m.t){
    case 'welcome': NET.me = m.you; NET.retry = 0; break;
    case 'lobby':
      NET.host = m.host; NET.players = m.players; NET.phase = m.phase;
      if (G.mode === 'lobby') renderLobby();
      break;
    case 'err': NET.serverErr = true; $('lobbyErr').textContent = m.msg; break;
    case 'mark':
      lobbyEl.classList.add('hide'); resultsEl.classList.add('hide'); selectEl.classList.add('hide');
      resetRaceOnline(m.lineup);
      G.mode = 'ready'; G.call = 'mark'; G.excite = 0.4;
      showCall('제자리에…', true); beep(520, 0.15);
      break;
    case 'set':
      if (G.mode !== 'ready') break;
      G.call = 'set'; G.excite = 0.05; showCall('차렷!', true); beep(700, 0.15);
      break;
    case 'bang': if (G.mode === 'ready') startRace(); break;
    case 'false': {
      const tg = runnerById(m.id); if (!tg) break;
      G.mode = 'ready'; G.call = 'false';
      falseStartFx(tg);
      break;
    }
    case 'pos': {
      const now = performance.now();
      for (const [id, x, v] of m.p){
        if (id === NET.me) continue;
        const r = runnerById(id); if (!r) continue;
        r.netX = x; r.netV = v; r.netT = now;
      }
      break;
    }
    case 'fin': {
      const r = runnerById(m.id);
      if (r && r.remote){ r.time = m.time; r.netX = Math.max(r.netX, 100); }
      break;
    }
    case 'results': {
      const list = m.list.map(e => {
        let r = runners.find(x => x.lane === e.lane);
        if (!r){ const c = ROSTER[e.char] || ROSTER[0]; r = {...c, name:e.name, lane:e.lane}; }
        return {r, time: e.time};
      });
      showResults(list);
      break;
    }
  }
}

let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  update(dt); render(); hud();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
